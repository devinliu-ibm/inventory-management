name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The docs point to `settings` for environment config; the step-level
          # `env` below is a fallback in case the process inherits it instead.
          # The base URL stays in a secret because this repo is public.
          settings: '{"env": {"ANTHROPIC_BASE_URL": "${{ secrets.ANTHROPIC_BASE_URL }}"}}'
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for bugs, security issues, and code quality.
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
